<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fathom Audio</title>
    
<style>
    body {
    background-color: black;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
    }

    .center {
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    width: 100%;
    }
    
    .message {
    min-height: 200px;
    color: white;
    font-size: 40px;
    font-weight: bold;
    padding: 20px;
    box-sizing: border-box;
    }
    
    .center img {
    max-width: 90%;
    max-height: 300px;
    width: auto;
    height: auto;
    object-fit: contain;
    display: block;
    margin: 20px auto;
}

</style>
</head>

<body>

    <div class="center message">
    <p>Merry Christmas Fathom Cru!!!</p>
    </div>

    <div class="center">
    <img src="Fathom remastered.png" alt="Fathom Audio">
    </div>

</body>
</html>
